<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIFs Rebotando</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    .bouncing-gif {
      position: absolute;
      top: 0;
      left: 0;
      width: 130px;
      height: auto;
      will-change: transform;
    }
    #prompt {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div id="prompt">Toca la pantalla o haz clic para reproducir sonido 🔊</div>

  <!-- GIFs 1 al 3 -->
  <img src="gif1.gif" class="bouncing-gif" id="gif1" alt="GIF 1">
  <img src="gif2.gif" class="bouncing-gif" id="gif2" alt="GIF 2">
  <img src="gif3.gif" class="bouncing-gif" id="gif3" alt="GIF 3">

  <!-- GIFs 4 al 6 (Nuevos) -->
  <img src="gif4.gif" class="bouncing-gif" id="gif4" alt="GIF 4">
  <img src="gif5.gif" class="bouncing-gif" id="gif5" alt="GIF 5">
  <img src="gif6.gif" class="bouncing-gif" id="gif6" alt="GIF 6">

  <!-- Audio configurado con repetición -->
  <audio id="miSonido" src="sonido.mp3" loop preload="auto"></audio>

  <script>
    // Configuración de posiciones iniciales y trayectorias opuestas para evitar superposiciones
    const gifs = [
      // Primer grupo
      { el: document.getElementById('gif1'), x: 30, y: 30, vx: 2.8, vy: 2.2 },
      { el: document.getElementById('gif2'), x: 180, y: 220, vx: -2.3, vy: 3.1 },
      { el: document.getElementById('gif3'), x: 300, y: 100, vx: 3.2, vy: -2.4 },

      // Segundo grupo (direcciones opuestas y posiciones distribuidas)
      { el: document.getElementById('gif4'), x: window.innerWidth - 160, y: 50, vx: -3.0, vy: -2.1 },
      { el: document.getElementById('gif5'), x: window.innerWidth - 300, y: window.innerHeight - 180, vx: 2.5, vy: -3.3 },
      { el: document.getElementById('gif6'), x: 100, y: window.innerHeight - 160, vx: -2.7, vy: 2.6 }
    ];

    function animar() {
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;

      gifs.forEach(item => {
        const width = item.el.offsetWidth || 130;
        const height = item.el.offsetHeight || 130;

        item.x += item.vx;
        item.y += item.vy;

        // Rebotes en bordes laterales
        if (item.x <= 0) {
          item.x = 0;
          item.vx *= -1;
        } else if (item.x + width >= screenWidth) {
          item.x = screenWidth - width;
          item.vx *= -1;
        }

        // Rebotes en bordes superior e inferior
        if (item.y <= 0) {
          item.y = 0;
          item.vy *= -1;
        } else if (item.y + height >= screenHeight) {
          item.y = screenHeight - height;
          item.vy *= -1;
        }

        item.el.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
      });

      requestAnimationFrame(animar);
    }

    requestAnimationFrame(animar);

    // Control de audio
    const audio = document.getElementById('miSonido');
    const promptMsg = document.getElementById('prompt');
    let audioActivo = false;

    function reproducirAudio() {
      if (audioActivo) return;
      audioActivo = true;

      audio.play().then(() => {
        promptMsg.style.opacity = '0';

        // Detener después de 12 segundos (4 reproducciones de 3 segundos)
        setTimeout(() => {
          audio.pause();
          audio.currentTime = 0;
        }, 12000);
      }).catch(() => {
        audioActivo = false;
      });
    }

    window.addEventListener('click', reproducirAudio);
    window.addEventListener('touchstart', reproducirAudio);
  </script>
</body>
</html>
